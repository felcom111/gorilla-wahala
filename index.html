<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gorilla Wahala - NFT Market</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #0f0f1a; color: white; text-align: center; padding-top: 80px; }
        header { position: fixed; top: 0; width: 100%; padding: 15px 30px; background-color: rgba(15, 15, 26, 0.95); border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .logo { font-size: 1.5rem; font-weight: bold; color: #00b4d8; }
        .btn-connect { background-color: #7b2cbf; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-connect:hover { background-color: #9d4edd; }
        .container { max-width: 1200px; margin: 40px auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; padding: 20px; }
        .card { background-color: #1a1a2e; border-radius: 15px; border: 1px solid #333; overflow: hidden; transition: transform 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: #7b2cbf; }
        .card img { width: 100%; height: 320px; object-fit: cover; background-color: #252542; display: block; }
        .card-body { padding: 20px; }
        .price { font-size: 1.3rem; color: #00b4d8; margin: 10px 0 20px; font-weight: bold; }
        .btn-buy { background: linear-gradient(45deg, #7b2cbf, #00b4d8); width: 100%; padding: 15px; border: none; border-radius: 8px; color: white; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.3s; }
        .btn-buy:disabled { opacity: 0.6; cursor: not-allowed; }
        .status { margin-top: 12px; color: #ccc; font-size: 0.9rem; min-height: 24px; line-height: 1.5; }
    </style>
</head>
<body>

<header>
    <div class="logo">Gorilla Wahala</div>
    <button id="connectBtn" class="btn-connect">ربط محفظة المشتري</button>
</header>

<div class="container">
    <div class="card">
        <img src="1.png" onerror="this.src='https://imgur.com'" alt="Gorilla Starter">
        <div class="card-body">
            <h2>Gorilla Starter</h2>
            <div class="price">0.005 ETH</div>
            <button class="btn-buy" onclick="buyNFT('0.005', 'Gorilla Starter', this)">شراء الآن</button>
            <div class="status"></div>
        </div>
    </div>

    <div class="card">
        <img src="2.png" onerror="this.src='https://imgur.com'" alt="Gorilla Premium">
        <div class="card-body">
            <h2>Gorilla Premium</h2>
            <div class="price">4 ETH</div>
            <button class="btn-buy" onclick="buyNFT('4', 'Gorilla Premium', this)">شراء الآن</button>
            <div class="status"></div>
        </div>
    </div>

    <div class="card">
        <img src="3.png" onerror="this.src='https://imgur.com'" alt="Gorilla Elite">
        <div class="card-body">
            <h2>Gorilla Elite</h2>
            <div class="price">10 ETH</div>
            <button class="btn-buy" onclick="buyNFT('10', 'Gorilla Elite', this)">شراء الآن</button>
            <div class="status"></div>
        </div>
    </div>
</div>

<script>
    // عنوان محفظتك التي ستستلم الأرباح مباشرة
    const SELLER_WALLET = "0xd421417d785bda042BdA4b341D9a997081864335";
    const ETHEREUM_MAINNET_CHAIN_ID = "0x1";
    let buyerAccount = null;

    // تحويل سعر ETH إلى صيغة البلوكشين Hex Wei بدقة
    function ethToHexWei(ethString) {
        const [whole, fraction = ""] = ethString.split(".");
        const paddedFraction = fraction.padEnd(18, "0").slice(0, 18);
        const weiBigInt = BigInt(whole) * (10n ** 18n) + BigInt(paddedFraction);
        return "0x" + weiBigInt.toString(16);
    }

    // دالة ربط محفظة المشتري تلقائياً
    async function connectBuyerWallet() {
        // إذا كان المشتري يفتح الموقع من متصفح عادي بدون محفظة
        if (typeof window.ethereum === 'undefined') {
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            if (isMobile) {
                // تحويل المشتري تلقائياً لفتح الرابط داخل تطبيق MetaMask على هاتفه
                const currentUrl = window.location.href.replace(/^https?:\/\//, '');
                window.location.href = "https://app.link" + currentUrl;
            } else {
                alert("يرجى تثبيت إضافة محفظة MetaMask أو Trust Wallet على متصفحك لإتمام الشراء.");
            }
            return null;
        }

        try {
            // فتح نافذة المحفظة للمشتري ليختار حسابه ويوافق على الربط
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            
            if (!accounts || accounts.length === 0) {
                alert("يرجى فتح قفل محفظتك (Unlock) واختيار حساب واحد على الأقل.");
                return null;
            }

            buyerAccount = accounts[0];

            // تحديث زر المحفظة في الأعلى بعنوان المشتري
            const connectBtn = document.getElementById('connectBtn');
            connectBtn.innerText = "محفظتك: " + buyerAccount.substring(0, 6) + "..." + buyerAccount.substring(38);
            connectBtn.style.backgroundColor = "#2b9348";

            // التأكد من أن المشتري على شبكة الإيثيريوم الرئيسية
            const currentChainId = await window.ethereum.request({ method: 'eth_chainId' });
            if (currentChainId !== ETHEREUM_MAINNET_CHAIN_ID) {
                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: ETHEREUM_MAINNET_CHAIN_ID }],
                    });
                } catch (switchError) {
                    alert("يرجى تحويل الشبكة داخل محفظتك إلى Ethereum Mainnet لإتمام الدفع.");
                    return null;
                }
            }

            return buyerAccount;
        } catch (err) {
            console.error(err);
            if (err.message && err.message.includes("at least one account")) {
                alert("محفظتك مقفلة حالياً! اضغط على أيقونة المحفظة في الأعلى وأدخل كلمة المرور لفتحها، ثم اضغط شراء مرة أخرى.");
            } else if (err.code === 4001) {
                alert("تم رفض طلب ربط المحفظة.");
            } else {
                alert("حدث خطأ أثناء ربط المحفظة: " + err.message);
            }
            return null;
        }
    }

    document.getElementById('connectBtn').addEventListener('click', connectBuyerWallet);

    // دالة الشراء: تخصم من المشتري وترسل المبلغ مباشرة لمحفظتك
    async function buyNFT(priceEth, nftName, btnElement) {
        const statusDiv = btnElement.parentElement.querySelector('.status');
        
        // الخطوة 1: ربط محفظة المشتري تلقائياً
        const account = await connectBuyerWallet();
        if (!account) return;

        // الخطوة 2: إرسال طلب الخصم والتحويل لمحفظتك
        try {
            btnElement.disabled = true;
            statusDiv.style.color = "#ffd166";
            statusDiv.textContent = "افتح محفظتك لتأكيد دفع " + priceEth + " ETH...";

            const hexValue = ethToHexWei(priceEth);

            const txHash = await window.ethereum.request({
                method: 'eth_sendTransaction',
                params: [{
                    from: account,         // محفظة المشتري
                    to: SELLER_WALLET,     // محفظتك أنت المستلمة للأرباح
                    value: hexValue        // المبلغ بالـ ETH
                }]
            });

            statusDiv.style.color = "#06d6a0";
            statusDiv.innerHTML = `
                تمت عملية الشراء بنجاح! ✅<br>
                <a href="https://etherscan.io{txHash}" target="_blank" style="color:#00b4d8; text-decoration:underline;">
                    عرض إيصال التحويل (Etherscan)
                </a>
            `;
            alert("شكراً لشرائك " + nftName + "! تم تحويل المبلغ بنجاح.");

        } catch (err) {
            console.error(err);
            statusDiv.style.color = "#ef476f";
            if (err.code === 4001) {
                statusDiv.textContent = "تم إلغاء عملية الدفع من قبل المشتري.";
            } else {
                statusDiv.textContent = "تعذر إتمام الدفع: تأكد من توفر رصيد ETH كافٍ في محفظتك.";
            }
        } finally {
            btnElement.disabled = false;
        }
    }

    // تحديث الواجهة تلقائياً إذا غيّر المشتري حسابه في المحفظة
    if (typeof window.ethereum !== 'undefined') {
        window.ethereum.on('accountsChanged', (accounts) => {
            if (accounts.length > 0) {
                buyerAccount = accounts[0];
                document.getElementById('connectBtn').innerText = "محفظتك: " + buyerAccount.substring(0, 6) + "..." + buyerAccount.substring(38);
            } else {
                buyerAccount = null;
                document.getElementById('connectBtn').innerText = "ربط محفظة المشتري";
            }
        });
    }
</script>

</body>
</html>
